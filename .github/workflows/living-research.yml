name: Update Living Research

on:
  schedule:
    - cron: "23 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: living-research-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.7.32"

      - name: Install R dependencies
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'

      - name: Update, validate, and render notes
        run: Rscript scripts/update_living_research.R

      - name: Commit updated publications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/live-research _data
          if git diff --cached --quiet; then
            echo "No new source release; nothing to commit."
          else
            git commit -m "Update Living Research"
            git pull --rebase --autostash
            git push
          fi
