name: Living Research branch test (temporary)

# Temporary: runs the living-research update on this feature branch without
# committing anything, and uploads the rendered note for inspection.
# Delete this file before merging.
on:
  push:
    branches:
      - living-research/first-stage-accelerated

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.3"
          use-public-rspm: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      - name: Install R dependencies
        run: |
          Rscript -e '
            pkgs <- c("jsonlite", "dplyr", "tidyr", "ggplot2", "scales", "fixest", "rdrobust", "knitr", "rmarkdown")
            install.packages(pkgs)
            missing <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
            if (length(missing)) stop("Failed to install: ", paste(missing, collapse = ", "))
          '

      - name: Update, validate, and render notes
        run: Rscript scripts/update_living_research.R

      - name: Show first-stage summary
        if: always()
        run: |
          Rscript -e 'x <- jsonlite::read_json("living-research/eu-migration-pact/results_summary.json"); str(x$first_stage, max.level = 1)' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: living-research-output
          path: |
            assets/living-research/eu-migration-pact/index.html
            living-research/eu-migration-pact/results_summary.json
            living-research/eu-migration-pact/figures/
